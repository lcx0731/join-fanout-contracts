name: Tests and deterministic demo

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: python -m pip install ".[test]"
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run tests with warnings as errors
        run: python -m pytest -W error
      - name: Run deterministic example and SQLite cross-checks
        env:
          PYTHONWARNINGS: error
        run: join-audit-demo --output /tmp/join-audit-results
